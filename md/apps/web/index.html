<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="keywords" content="md,markdown,markdown-editor,wechat,official-account,yanglbme,doocs" />
    <meta name="description" content="Wechat Markdown Editor | 一款高度简洁的微信 Markdown 编辑器" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <title>微信 Markdown 编辑器 | Doocs 开源社区</title>
    <style>
      html,
      body,
      #app {
        margin: 0;
        width: 100%;
        min-height: 100%;
        background: #f7faf8;
      }

      @media (prefers-color-scheme: dark) {
        html,
        body,
        #app {
          background: #191919;
        }
      }

      .loading {
        display: flex;
        min-height: 100vh;
        box-sizing: border-box;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        color: #33443b;
        background: #f7faf8;
        font:
          16px/1.5 system-ui,
          sans-serif;
      }
      .loading span {
        color: #718078;
        font-size: 14px;
      }
      @media (prefers-color-scheme: dark) {
        .loading {
          color: #f3f4f6;
          background: #191919;
        }
        .loading span {
          color: #a3aaa6;
        }
      }

      html[data-embedded-theme='dark'] .loading {
        color: #f3f4f6;
        background: #191919;
      }

      html[data-embedded-theme='dark'] .loading span {
        color: #a3aaa6;
      }

      html[data-embedded-theme='light'],
      html[data-embedded-theme='light'] body,
      html[data-embedded-theme='light'] #app {
        background: #f7faf8;
      }
    </style>
    <link rel="shortcut icon" href="https://cdn-doocs.oss-cn-shenzhen.aliyuncs.com/gh/doocs/md/images/favicon.png" />
    <link
      rel="apple-touch-icon-precomposed"
      href="https://cdn-doocs.oss-cn-shenzhen.aliyuncs.com/gh/doocs/md/images/1648303220922-7e14aefa-816e-44c1-8604-ade709ca1c69.png"
    />
  </head>

  <body>
    <noscript>
      <strong>Please enable JavaScript to continue.</strong>
    </noscript>
    <script>
      const embeddedTheme = new URLSearchParams(window.location.search).get('theme')
      if (embeddedTheme === 'dark' || embeddedTheme === 'light') {
        document.documentElement.dataset.embeddedTheme = embeddedTheme
      }
    </script>
    <div id="app">
      <div class="loading" role="status" aria-live="polite">
        <strong>致力于让 Markdown 编辑更简单</strong>
        <span>正在加载编辑器</span>
      </div>
    </div>
    <script>
      window.MathJax = {
        tex: { tags: 'ams' },
        svg: { fontCache: 'none' },
      }
    </script>
    <script
      id="MathJax-script"
      src="https://cdn-doocs.oss-cn-shenzhen.aliyuncs.com/npm/mathjax@3/es5/tex-svg.js"
    ></script>
    <script src="https://cdn-doocs.oss-cn-shenzhen.aliyuncs.com/npm/mermaid@11/dist/mermaid.min.js"></script>
    <script type="module" src="/src/main.ts"></script>
    <script type="module" src="/src/sidepanel.ts"></script>
  </body>
  <script src="https://cdn-doocs.oss-cn-shenzhen.aliyuncs.com/gh/wechatsync/article-syncjs@latest/dist/main.js"></script>
</html>
