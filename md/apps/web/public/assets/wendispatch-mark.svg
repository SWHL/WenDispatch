<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">WenDispatch</title>
  <desc id="desc">A compact W monogram dispatching content to four destinations</desc>

  <!-- Short, even routes keep the mark legible in the 32px navigation header. -->
  <g fill="none" stroke="#52685e" stroke-width="7" stroke-linecap="round">
    <path d="M48 48 29 29M80 48l19-19M80 80l19 19M48 80 29 99"/>
  </g>
  <g fill="#16804c">
    <circle cx="24" cy="24" r="6.5"/>
    <circle cx="104" cy="24" r="6.5"/>
    <circle cx="104" cy="104" r="6.5"/>
    <circle cx="24" cy="104" r="6.5"/>
  </g>

  <!-- The open hub gives the W room to read as one centered shape. -->
  <circle cx="64" cy="64" r="21" fill="none" stroke="#344047" stroke-width="7"/>
  <path d="m51 56 5 17 8-12 8 12 5-17" fill="none" stroke="#16804c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
