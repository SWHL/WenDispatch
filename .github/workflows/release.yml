name: Build and Release Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v2.0.0)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # Both workspace lockfiles use pnpm 10's lockfile v9 metadata.
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build MD editor assets
        run: pnpm --filter @wendispatch/extension build:md-editor

      - name: Run tests
        run: pnpm exec vitest run

      - name: Build extension
        run: pnpm build

      - name: Get version from manifest
        id: version
        run: |
          VERSION=$(node -p "require('./apps/extension/dist/manifest.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create ZIP package
        run: |
          mkdir -p release/assets
          cd apps/extension/dist
          zip -r ../../../release/assets/wendispatch-${{ steps.version.outputs.version }}.zip .

      - name: Check CRX signing key
        id: crx
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          if [ -n "$CRX_PRIVATE_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create CRX package
        if: ${{ steps.crx.outputs.enabled == 'true' }}
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          # Install crx package
          npm install -g crx

          # Write private key to file
          echo "$CRX_PRIVATE_KEY" > extension.pem

          # Create CRX file
          crx pack apps/extension/dist -o release/assets/wendispatch-${{ steps.version.outputs.version }}.crx -p extension.pem

          # Clean up private key
          rm -f extension.pem

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: wendispatch-zip
          path: release/assets/wendispatch-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

      - name: Upload CRX artifact
        if: ${{ steps.crx.outputs.enabled == 'true' }}
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        uses: actions/upload-artifact@v4
        with:
          name: wendispatch-crx
          path: release/assets/wendispatch-${{ steps.version.outputs.version }}.crx
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: 写入更新日志配置并生成变更说明
        shell: bash
        run: |
          cat > cliff.toml <<'EOF'
          [changelog]
          header = """
          # 更新日志

          本文件由 [git-cliff](https://git-cliff.org/) 根据 Git 提交记录自动生成。
          """
          body = """
          {% if version %}## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}{% else %}## 未发布{% endif %}
          {% for group, commits in commits | group_by(attribute="group") %}
          ### {{ group | striptags | trim }}
          {% for commit in commits %}- {% if commit.breaking %}**破坏性变更：** {% endif %}{% if commit.scope %}**{{ commit.scope }}**：{% endif %}{{ commit.message | split(pat="\\n") | first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/SWHL/WenDispatch/commit/{{ commit.id }}))
          {% endfor %}
          {% endfor %}
          """
          trim = true

          [git]
          conventional_commits = true
          filter_unconventional = false
          split_commits = false
          protect_breaking_commits = true
          filter_commits = false
          commit_parsers = [
            { message = "^feat", group = "<!-- 01 --> 新增功能" },
            { message = "^fix", group = "<!-- 02 --> 问题修复" },
            { message = "^perf", group = "<!-- 03 --> 性能优化" },
            { message = "^refactor", group = "<!-- 04 --> 代码重构" },
            { message = "^docs", group = "<!-- 05 --> 文档更新" },
            { message = "^test", group = "<!-- 06 --> 测试" },
            { message = "^style", group = "<!-- 07 --> 代码格式" },
            { message = "^build", group = "<!-- 08 --> 构建系统" },
            { message = "^ci", group = "<!-- 09 --> 持续集成" },
            { message = "^revert", group = "<!-- 10 --> 回退变更" },
            { message = "^chore", group = "<!-- 11 --> 项目维护" },
            { message = ".*", group = "<!-- 12 --> 其他变更" },
          ]
          tag_pattern = '^v[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.-]+)?(\\+[0-9A-Za-z.-]+)?$'
          topo_order = false
          sort_commits = "oldest"
          EOF
          git cliff --config cliff.toml --latest --strip header > release-changes.md
          cat > release-notes.md <<'EOF'
          ## 下载

          | 文件 | 说明 |
          |------|------|
          | `wendispatch-*.zip` | 未打包扩展，可用于开发者模式 |
          | `wendispatch-*.crx` | 已打包扩展，需要开发者模式 |

          ## 安装

          **从 ZIP 安装**
          1. 从下方资源下载 `wendispatch-*.zip`
          2. 将 ZIP 解压到文件夹
          3. 打开 Chrome，访问 `chrome://extensions/`
          4. 开启右上角的“开发者模式”
          5. 点击“加载已解压的扩展程序”，选择解压后的文件夹

          **从 CRX 安装**
          1. 从下方资源下载 `wendispatch-*.crx`
          2. 打开 Chrome，访问 `chrome://extensions/`
          3. 开启“开发者模式”
          4. 将 `.crx` 文件拖放到扩展程序页面

          > **提示**：Chrome 安全策略要求从 Chrome 网上应用店之外安装 CRX 文件时开启开发者模式。

          ## 变更内容

          EOF
          cat release-changes.md >> release-notes.md

      - name: Download ZIP artifact
        uses: actions/download-artifact@v4
        with:
          name: wendispatch-zip
          path: release/assets

      - name: Download CRX artifact
        uses: actions/download-artifact@v4
        with:
          name: wendispatch-crx
          path: release/assets
        continue-on-error: true

      - name: Get tag name
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: false
          files: |
            release/assets/wendispatch-*.zip
            release/assets/wendispatch-*.crx
          fail_on_unmatched_files: false
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
