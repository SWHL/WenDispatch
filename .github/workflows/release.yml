name: Build and Release Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v2.0.0)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # Both workspace lockfiles use pnpm 10's lockfile v9 metadata.
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [[ -n "$INPUT_VERSION" ]]; then
            VERSION="$INPUT_VERSION"
            VERSION="${VERSION#v}"
          else
            VERSION=$(node -p "require('./apps/extension/package.json').version")
          fi
          # Chrome requires a numeric manifest version; retain prerelease labels
          # in version_name and the archive filename.
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release version: $VERSION"
            exit 1
          fi
          MANIFEST_VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          for COMPONENT in "${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}" "${BASH_REMATCH[3]}"; do
            if [[ ${#COMPONENT} -gt 5 ]] || (( COMPONENT > 65535 )); then
              echo "::error::Chrome version components must be at most 65535"
              exit 1
            fi
          done
          if [[ "$MANIFEST_VERSION" == 0.0.0 ]]; then
            echo "::error::Chrome does not accept version 0.0.0"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "EXTENSION_VERSION=${MANIFEST_VERSION}" >> "$GITHUB_ENV"
          echo "EXTENSION_VERSION_NAME=${VERSION}" >> "$GITHUB_ENV"

      - name: Build MD editor assets
        run: pnpm --filter @wendispatch/extension build:md-editor

      - name: Run tests
        run: pnpm exec vitest run

      - name: Build extension
        run: pnpm build

      - name: Create ZIP package
        run: |
          mkdir -p release/assets
          cd apps/extension/dist
          zip -r ../../../release/assets/wendispatch-${{ steps.version.outputs.version }}.zip .

      - name: Check CRX signing key
        id: crx
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          if [ -n "$CRX_PRIVATE_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create CRX package
        if: ${{ steps.crx.outputs.enabled == 'true' }}
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          # Install crx package
          npm install -g crx

          # Write private key to file
          echo "$CRX_PRIVATE_KEY" > extension.pem

          # Create CRX file
          crx pack apps/extension/dist -o release/assets/wendispatch-${{ steps.version.outputs.version }}.crx -p extension.pem

          # Clean up private key
          rm -f extension.pem

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: wendispatch-zip
          path: release/assets/wendispatch-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

      - name: Upload CRX artifact
        if: ${{ steps.crx.outputs.enabled == 'true' }}
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        uses: actions/upload-artifact@v4
        with:
          name: wendispatch-crx
          path: release/assets/wendispatch-${{ steps.version.outputs.version }}.crx
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 生成 Release notes
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if [[ -z "$VERSION" || "$VERSION" == "$GITHUB_REF" ]]; then
            echo "::error::无法从 Git tag 解析版本号"
            exit 1
          fi
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { found=1; next }
            found && $0 ~ /^## \[/ { exit }
            found { print }
          ' docs/CHANGELOG.md > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "::error::docs/CHANGELOG.md 中没有版本 [$VERSION] 的更新日志"
            exit 1
          fi

      - name: Download ZIP artifact
        uses: actions/download-artifact@v4
        with:
          name: wendispatch-zip
          path: release/assets

      - name: Download CRX artifact
        uses: actions/download-artifact@v4
        with:
          name: wendispatch-crx
          path: release/assets
        continue-on-error: true

      - name: Get tag name
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: false
          files: |
            release/assets/wendispatch-*.zip
            release/assets/wendispatch-*.crx
          fail_on_unmatched_files: false
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
