name: Build and Release Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v2.0.0)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # pnpm-lock.yaml uses the lockfile v9 format, which pnpm 8 cannot read.
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm exec vitest run

      - name: Build extension
        run: pnpm build

      - name: Get version from manifest
        id: version
        run: |
          VERSION=$(node -p "require('./apps/extension/dist/manifest.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create ZIP package
        run: |
          mkdir -p release/assets
          cd apps/extension/dist
          zip -r ../../../release/assets/synccaster-${{ steps.version.outputs.version }}.zip .

      - name: Check CRX signing key
        id: crx
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          if [ -n "$CRX_PRIVATE_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create CRX package
        if: ${{ steps.crx.outputs.enabled == 'true' }}
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          # Install crx package
          npm install -g crx

          # Write private key to file
          echo "$CRX_PRIVATE_KEY" > extension.pem

          # Create CRX file
          crx pack apps/extension/dist -o release/assets/synccaster-${{ steps.version.outputs.version }}.crx -p extension.pem

          # Clean up private key
          rm -f extension.pem

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: synccaster-zip
          path: release/assets/synccaster-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

      - name: Upload CRX artifact
        if: ${{ steps.crx.outputs.enabled == 'true' }}
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        uses: actions/upload-artifact@v4
        with:
          name: synccaster-crx
          path: release/assets/synccaster-${{ steps.version.outputs.version }}.crx
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: write

    steps:
      - name: Download ZIP artifact
        uses: actions/download-artifact@v4
        with:
          name: synccaster-zip
          path: release/assets

      - name: Download CRX artifact
        uses: actions/download-artifact@v4
        with:
          name: synccaster-crx
          path: release/assets
        continue-on-error: true

      - name: Get tag name
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: SyncCaster ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: false
          files: |
            release/assets/synccaster-*.zip
            release/assets/synccaster-*.crx
          fail_on_unmatched_files: false
          body: |
            ## SyncCaster ${{ steps.tag.outputs.tag }}

            ### Download

            | File | Description |
            |------|-------------|
            | `synccaster-*.zip` | Unpacked extension (for developer mode) |
            | `synccaster-*.crx` | Packed extension (requires developer mode) |

            ### Installation

            **Install from ZIP**
            1. Download `synccaster-*.zip` from the assets below
            2. Extract the ZIP file to a folder
            3. Open Chrome and go to `chrome://extensions/`
            4. Enable "Developer mode" (toggle in top right)
            5. Click "Load unpacked" and select the extracted folder

            **Install from CRX**
            1. Download `synccaster-*.crx` from the assets below
            2. Open Chrome and go to `chrome://extensions/`
            3. Enable "Developer mode" (toggle in top right)
            4. Drag and drop the `.crx` file onto the extensions page

            > **Note**: Due to Chrome security policies, CRX files from outside the Chrome Web Store require Developer Mode to be enabled.

            ### Changes
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
