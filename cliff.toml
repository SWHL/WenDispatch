# WenDispatch 更新日志配置：https://git-cliff.org/docs/configuration/
# 完整日志：git cliff -o CHANGELOG.md
# 未发布变更：git cliff --unreleased
# 当前版本说明：git cliff --latest --strip header

[changelog]
header = """
# 更新日志

本文件由 [git-cliff](https://git-cliff.org/) 根据 Git 提交记录自动生成。

"""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## 未发布
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}\
- {% if commit.breaking %}**破坏性变更：** {% endif %}\
{% if commit.scope %}**{{ commit.scope }}**：{% endif %}\
{{ commit.message | split(pat="\\n") | first }} \
([{{ commit.id | truncate(length=7, end="") }}](https://github.com/SWHL/WenDispatch/commit/{{ commit.id }}))
{% if commit.breaking_description %}\
  > {{ commit.breaking_description | replace(from="\\n", to="\\n  > ") }}
{% endif %}\
{% endfor %}\
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
# 保留 Initial commit 等非 Conventional Commits 提交。
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false

# HTML 注释控制分类顺序，渲染时由 striptags 移除。
commit_parsers = [
  { message = "^feat", group = "<!-- 01 --> 新增功能" },
  { message = "^fix", group = "<!-- 02 --> 问题修复" },
  { message = "^perf", group = "<!-- 03 --> 性能优化" },
  { message = "^refactor", group = "<!-- 04 --> 代码重构" },
  { message = "^docs", group = "<!-- 05 --> 文档更新" },
  { message = "^test", group = "<!-- 06 --> 测试" },
  { message = "^style", group = "<!-- 07 --> 代码格式" },
  { message = "^build", group = "<!-- 08 --> 构建系统" },
  { message = "^ci", group = "<!-- 09 --> 持续集成" },
  { message = "^revert", group = "<!-- 10 --> 回退变更" },
  { message = "^chore", group = "<!-- 11 --> 项目维护" },
  { message = ".*", group = "<!-- 12 --> 其他变更" },
]

# 与发布工作流的 v 前缀保持一致，支持预发布和构建元数据。
tag_pattern = '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
topo_order = false
sort_commits = "oldest"
